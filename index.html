        html,body{height:100%;margin:0;padding:0}
        body{font-family:'Plus Jakarta Sans','Sarabun',sans-serif;background:#08080a;color:#f4f4f5;display:flex;flex-direction:column;overflow:hidden}

        .studio-card:hover{border-color:rgba(255,255,255,.15);background:rgba(24,24,27,.7)}

        .custom-scrollbar::-webkit-scrollbar-track{background:transparent}
        .custom-scrollbar::-webkit-scrollbar-thumb{background:#27272a;border-radius:2px}

        input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;height:18px;width:18px;border-radius:50%;background:#38bdf8;cursor:pointer;box-shadow:0 0 8px rgba(56,189,248,.5);transition:transform .1s ease}
        input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.2)}

        .sidebar-left,.sidebar-right{transition:transform .3s cubic-bezier(.16,1,.3,1)}
        @media(max-width:1023px){
            .sidebar-left{position:fixed;top:56px;left:0;bottom:0;width:min(320px,88vw);z-index:50;transform:translateX(-100%)}
            .sidebar-left.open{transform:translateX(0)}
            .sidebar-right{position:fixed;top:56px;right:0;bottom:0;width:min(320px,88vw);z-index:50;transform:translateX(100%)}
            .sidebar-right.open{transform:translateX(0)}
        }

        #overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;backdrop-filter:blur(2px)}
        #overlay.active{display:block}

        #exportModal{display:none;position:fixed;inset:0;z-index:100;align-items:center;justify-content:center;padding:1rem}
        #exportModal.active{display:flex}
        #exportModal .modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px)}
        #exportModal .modal-box{position:relative;z-index:1;background:#0e0e11;border:1px solid rgba(255,255,255,.1);border-radius:16px;width:100%;max-width:640px;max-height:85vh;overflow-y:auto;padding:24px;box-shadow:0 25px 60px rgba(0,0,0,.8)}

        #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

        @media(max-width:640px){#bottomCard{left:8px;right:8px;bottom:8px}}

let currentExportType='ros';

function openExportModal(type){
  currentExportType=type;
  const d=EXPORTS[type];
  document.getElementById('modalTitle').textContent=d.title;
  document.getElementById('modalSubtitle').textContent=d.subtitle;
  document.getElementById('modalContent').querySelector('pre').textContent=d.text;
  document.getElementById('downloadBtnText').textContent='Download '+d.ext;
  document.getElementById('exportModal').classList.add('active');
  lucide.createIcons();
}
function closeExportModal(){document.getElementById('exportModal').classList.remove('active')}
function copyModalContent(){
  navigator.clipboard.writeText(EXPORTS[currentExportType].text).then(()=>showToast('Copied to clipboard'));
}
function downloadModalContent(){
  const d=EXPORTS[currentExportType];
  const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(new Blob([d.text],{type:'text/plain'})),download:d.filename});
  a.click();
  showToast('Downloaded '+d.filename);
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

function toggleLeft(){
  const l=document.getElementById('leftSidebar'),r=document.getElementById('rightSidebar'),ov=document.getElementById('overlay');
  const open=!l.classList.contains('open');
  r.classList.remove('open');l.classList.toggle('open',open);ov.classList.toggle('active',open);
}
function toggleRight(){
  const l=document.getElementById('leftSidebar'),r=document.getElementById('rightSidebar'),ov=document.getElementById('overlay');
  const open=!r.classList.contains('open');
  l.classList.remove('open');r.classList.toggle('open',open);ov.classList.toggle('active',open);
}
function closeSidebars(){
  document.getElementById('leftSidebar').classList.remove('open');
  document.getElementById('rightSidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('active');
}

let scene,camera,renderer,controls,parts={},currentStepIndex=0,isAutoPlaying=false,autoTimer=null,isWireframe=false,isXray=false;

function initThree(){
  const c=document.getElementById('canvasContainer');
  scene=new THREE.Scene();scene.background=new THREE.Color(0x08080a);
  camera=new THREE.PerspectiveCamera(40,c.clientWidth/c.clientHeight,0.1,1000);
  camera.position.set(6,4.5,7.5);
  renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setSize(c.clientWidth,c.clientHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
  c.appendChild(renderer.domElement);
  controls=new THREE.OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true;controls.dampingFactor=0.05;
  controls.maxPolarAngle=Math.PI/2+0.15;controls.minDistance=3;controls.maxDistance=22;
  scene.add(new THREE.AmbientLight(0xffffff,0.85));
  const ml=new THREE.DirectionalLight(0xffffff,1.8);
  ml.position.set(6,12,8);ml.castShadow=true;ml.shadow.mapSize.set(2048,2048);scene.add(ml);
  const fl=new THREE.DirectionalLight(0x38bdf8,0.7);fl.position.set(-6,4,-4);scene.add(fl);
  const rl=new THREE.DirectionalLight(0x60a5fa,0.5);rl.position.set(0,-6,-4);scene.add(rl);
  const grid=new THREE.GridHelper(16,24,0x27272a,0x18181b);grid.position.y=-2;scene.add(grid);
  const sp=new THREE.Mesh(new THREE.PlaneGeometry(16,16),new THREE.ShadowMaterial({opacity:0.35}));
  sp.rotation.x=-Math.PI/2;sp.position.y=-2.001;sp.receiveShadow=true;scene.add(sp);
  buildModels();renderStepList();setupRaycaster();animate();
  window.addEventListener('resize',()=>{
    camera.aspect=c.clientWidth/c.clientHeight;
    camera.updateProjectionMatrix();renderer.setSize(c.clientWidth,c.clientHeight);
  });
}

function addPart(key,geo,mat,x,y,z){
  const m=new THREE.Mesh(geo,mat);
  m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;
  parts[key]={mesh:m,originalPos:new THREE.Vector3(x,y,z),targetPos:new THREE.Vector3(x,y,z),mat};
  return m;
}

function buildModels(){
  const asm=new THREE.Group();
  asm.add(addPart('casing_bottom',new THREE.BoxGeometry(4.4,.18,3),new THREE.MeshStandardMaterial({color:0x27272a,metalness:.6,roughness:.35}),0,-.45,0));
  asm.add(addPart('battery',new THREE.BoxGeometry(2.3,.1,1.2),new THREE.MeshStandardMaterial({color:0x18181b,metalness:.8,roughness:.25}),-.85,-.28,.65));
  asm.add(addPart('fan',new THREE.CylinderGeometry(.55,.55,.14,32),new THREE.MeshStandardMaterial({color:0xd97706,metalness:.4,roughness:.3}),1.4,-.26,-.75));
  asm.add(addPart('heatsink',new THREE.BoxGeometry(1.8,.08,.9),new THREE.MeshStandardMaterial({color:0xb45309,metalness:.95,roughness:.15}),.3,-.25,-.65));
  const pcbG=new THREE.Group();
  const pcbMat=new THREE.MeshStandardMaterial({color:0x064e3b,metalness:.2,roughness:.6});
  const pcbM=new THREE.Mesh(new THREE.BoxGeometry(4,.06,2.6),pcbMat);pcbM.castShadow=true;pcbG.add(pcbM);
  const soc=new THREE.Mesh(new THREE.BoxGeometry(.7,.03,.7),new THREE.MeshStandardMaterial({color:0x09090b,metalness:.9,roughness:.1}));
  soc.position.set(.3,.045,-.65);pcbG.add(soc);
  pcbG.position.y=-.32;
  parts['pcb']={mesh:pcbG,originalPos:new THREE.Vector3(0,-.32,0),targetPos:new THREE.Vector3(0,-.32,0),mat:pcbMat};
  asm.add(pcbG);
  asm.add(addPart('casing_top',new THREE.BoxGeometry(4.4,.16,3),new THREE.MeshStandardMaterial({color:0x1e1e24,metalness:.5,roughness:.4}),0,-.12,0));
  scene.add(asm);
}

function renderStepList(){
  const list=document.getElementById('stepList');
  list.innerHTML='';
  stepsData.forEach((s,i)=>{
    const act=i===currentStepIndex,past=i<currentStepIndex;
    const div=document.createElement('div');
    div.className=`p-2.5 rounded-lg border transition-all cursor-pointer select-none ${act?'bg-cyan-500/10 border-cyan-500/50':past?'bg-zinc-900/30 border-white/[0.04] opacity-50 hover:opacity-80':'bg-zinc-900/60 border-white/[0.05] hover:border-white/10'}`;
    div.onclick=()=>{selectStep(i);closeSidebars()};
    div.innerHTML=`<div class="flex items-center justify-between text-xs"><span class="font-medium ${act?'text-cyan-400 font-bold':'text-zinc-300'}">${s.name}</span><span class="text-[10px] font-mono ${past?'text-emerald-400':act?'text-cyan-400 font-bold':'text-zinc-500'}">${past?'DONE':act?'ACTIVE':'QUEUED'}</span></div><div class="text-[11px] text-zinc-400 mt-1 line-clamp-1">${s.desc}</div>`;
    list.appendChild(div);
  });
}

function selectStep(i){
  currentStepIndex=i;const d=stepsData[i];
  document.getElementById('currentStepBadge').textContent=`STEP ${d.id} / 6`;
  document.getElementById('currentStepTitle').textContent=d.name.split('. ').slice(1).join('. ');
  document.getElementById('currentStepDesc').textContent=d.desc;
  document.getElementById('currentTool').textContent=d.tool;
  document.getElementById('currentStrategy').textContent=d.strategy;
  document.getElementById('currentIntegrity').textContent=d.integrity;
  document.getElementById('forceDisplay').textContent=`${d.force} / 8.5 N`;
  document.getElementById('forceBar').style.width=d.forceW;
  document.getElementById('tempDisplay').textContent=d.temp;
  const tb=document.getElementById('tempBar');tb.style.width=d.tempW;
  tb.className=`${d.tempCls} h-full transition-all duration-500`;
  stepsData.forEach((s,idx)=>{
    const p=parts[s.part];if(!p)return;
    if(idx<=i)p.targetPos.set(p.originalPos.x+s.offset.x,p.originalPos.y+s.offset.y,p.originalPos.z+s.offset.z);
    else p.targetPos.copy(p.originalPos);
  });
  const pct=Math.round(i/(stepsData.length-1)*100);
  document.getElementById('explodeSlider').value=pct;
  document.getElementById('explodePercent').textContent=pct+'%';
  renderStepList();
}

function onExplodeSlider(v){
  const f=v/100;document.getElementById('explodePercent').textContent=v+'%';
  stepsData.forEach(s=>{const p=parts[s.part];if(p)p.targetPos.set(p.originalPos.x+s.offset.x*f,p.originalPos.y+s.offset.y*f,p.originalPos.z+s.offset.z*f)});
}

function triggerAutoPlay(){
  if(isAutoPlaying){clearInterval(autoTimer);isAutoPlaying=false;document.getElementById('playBtnText').textContent='Auto Sequence';document.getElementById('playBtn').classList.remove('opacity-60');return}
  isAutoPlaying=true;document.getElementById('playBtnText').textContent='Stop';document.getElementById('playBtn').classList.add('opacity-60');
  resetAssembly();let i=0;
  autoTimer=setInterval(()=>{selectStep(i);i++;if(i>=stepsData.length){clearInterval(autoTimer);isAutoPlaying=false;document.getElementById('playBtnText').textContent='Auto Sequence';document.getElementById('playBtn').classList.remove('opacity-60')}},1400);
}

function resetAssembly(){
  if(autoTimer)clearInterval(autoTimer);autoTimer=null;isAutoPlaying=false;
  document.getElementById('playBtnText').textContent='Auto Sequence';
  document.getElementById('playBtn').classList.remove('opacity-60','pointer-events-none');
  document.getElementById('explodeSlider').value=0;document.getElementById('explodePercent').textContent='0%';
  stepsData.forEach(s=>{const p=parts[s.part];if(p)p.targetPos.copy(p.originalPos)});
  selectStep(0);
}

function toggleWireframe(){isWireframe=!isWireframe;Object.values(parts).forEach(p=>{if(p.mat)p.mat.wireframe=isWireframe});document.getElementById('wireframeBtn').classList.toggle('text-cyan-400',isWireframe)}
function toggleXray(){isXray=!isXray;Object.values(parts).forEach(p=>{if(p.mat){p.mat.transparent=isXray;p.mat.opacity=isXray?.3:1;p.mat.depthWrite=!isXray}});document.getElementById('xrayBtn').classList.toggle('text-cyan-400',isXray)}
function setCameraView(v){const p={iso:[6,4.5,7.5],top:[0,10,.01],front:[0,0,9]}[v];if(p)camera.position.set(...p);controls.target.set(0,0,0);controls.update()}

function setupRaycaster(){
  const rc=new THREE.Raycaster(),ptr=new THREE.Vector2();
  function hit(cx,cy){
    const c=document.getElementById('canvasContainer'),r=c.getBoundingClientRect();
    ptr.x=((cx-r.left)/r.width)*2-1;ptr.y=-((cy-r.top)/r.height)*2+1;
    rc.setFromCamera(ptr,camera);
    const meshes=[];Object.values(parts).forEach(p=>p.mesh.traverse(ch=>{if(ch.isMesh)meshes.push(ch)}));
    const hits=rc.intersectObjects(meshes,false);
    if(!hits.length)return;
    let obj=hits[0].object;
    while(obj&&obj!==scene){const k=Object.keys(parts).find(k=>parts[k].mesh===obj||parts[k].mesh===obj.parent);if(k){const idx=stepsData.findIndex(s=>s.part===k);if(idx!==-1)selectStep(idx);return}obj=obj.parent}
  }
  let drag=false,md={x:0,y:0};
  const cv=renderer.domElement;
  cv.addEventListener('mousedown',e=>{md={x:e.clientX,y:e.clientY};drag=false});
  cv.addEventListener('mousemove',e=>{if(Math.abs(e.clientX-md.x)+Math.abs(e.clientY-md.y)>5)drag=true});
  cv.addEventListener('mouseup',e=>{if(!drag)hit(e.clientX,e.clientY)});
  let ts=null;
  cv.addEventListener('touchstart',e=>{ts={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
  cv.addEventListener('touchend',e=>{if(!ts)return;const t=e.changedTouches[0];if(Math.abs(t.clientX-ts.x)+Math.abs(t.clientY-ts.y)<10)hit(t.clientX,t.clientY);ts=null},{passive:true});
}

function animate(){requestAnimationFrame(animate);controls.update();Object.values(parts).forEach(p=>p.mesh.position.lerp(p.targetPos,.07));renderer.render(scene,camera)}

window.onload=()=>{initThree();lucide.createIcons();selectStep(0)};
